query GetSite($id: String!) {
  getSite(id: $id) {
    id
    name
    role
    status
    lastUpdate
    latitude
    longitude
    sensorReporting {
      deviceId
      deviceName
      sensorKey
      sensorType
      model
      enabled
      displayName
      unit
      sortOrder
      icon
    }
    latestSnapshot {
      id
      deviceId
      takenAt
      imageUrl
      byteSize
    }
    pollIntervalSeconds
  }
}
