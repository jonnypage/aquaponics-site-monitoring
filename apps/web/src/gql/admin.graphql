query SensorCatalog {
  sensorCatalog {
    key
    sensorType
    model
    displayName
    unit
    physicalMin
    physicalMax
    sortOrder
    icon
    wiringTemplate {
      wires {
        id
        label
        color
        required
      }
      allowExtraWires
      maxExtraWires
    }
    createdAt
    updatedAt
  }
}

query AdminUsers {
  adminUsers {
    id
    email
    name
    role
    createdAt
    updatedAt
    assignedSiteIds
  }
}

query AdminSites {
  adminSites {
    id
    name
    latitude
    longitude
    sensorReporting {
      deviceId
      deviceName
      sensorKey
      sensorType
      model
      enabled
      displayName
      unit
      sortOrder
      icon
    }
    sensorThresholds {
      deviceId
      sensorKey
      normalMin
      normalMax
      warningDelta
      criticalDelta
    }
    deviceSnapshotSettings {
      deviceId
      deviceName
      hasCamera
      snapshotsEnabled
    }
  }
}

query AdminDevices($siteId: String) {
  adminDevices(siteId: $siteId) {
    deviceId
    name
    siteId
    lastSeenAt
    expectedIntervalSeconds
    reportIntervalSeconds
    snapshotIntervalSeconds
    hasCamera
    board
    createdAt
    updatedAt
    sensorReadings {
      sensorKey
      sensorType
      displayName
      unit
      icon
      value
      takenAt
    }
  }
}

query AdminDevice($id: String!) {
  adminDevice(id: $id) {
    deviceId
    name
    siteId
    lastSeenAt
    expectedIntervalSeconds
    reportIntervalSeconds
    snapshotIntervalSeconds
    hasCamera
    board
    pinMap
    createdAt
    updatedAt
    recentSnapshots {
      id
      takenAt
      imageUrl
      byteSize
    }
  }
}

