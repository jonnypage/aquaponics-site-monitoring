    physicalMax
    sortOrder
    icon
    wiringTemplate {
      wires {
        id
        label
        color
        required
      }
      allowExtraWires
      maxExtraWires
    }
    createdAt
    updatedAt
  }
}

mutation UpdateSensorCatalogEntry($input: UpdateSensorCatalogEntryInput!) {
  updateSensorCatalogEntry(input: $input) {
    key
    sensorType
    model
    displayName
    unit
    physicalMin
    physicalMax
    sortOrder
    icon
