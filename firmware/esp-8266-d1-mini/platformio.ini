[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@7.4.2
  paulstoffregen/OneWire@2.3.8
  milesburton/DallasTemperature@4.0.4
build_flags =
  -DUD_CFG_REGION_SIZE=2048
  ; Set to 0 before production — prints WiFi SSID on serial at 115200
  -DUD_WIFI_DEBUG=1
