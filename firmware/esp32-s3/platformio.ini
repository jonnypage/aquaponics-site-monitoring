; ESP32-S3-DevKitC-1 N16R8 — real sensor telemetry, no camera.
; Build merged image via post:extra_scripts/merge_factory_bin.py (repo: pnpm firmware:build:esp32:s3)

[platformio]
boards_dir = boards

[env:esp32-s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1-n16r8
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
extra_scripts = post:extra_scripts/merge_factory_bin.py
lib_extra_dirs = ../shared
build_flags =
  -DUD_CFG_REGION_SIZE=2048
  -DUD_WIFI_DEBUG=1
  -DCORE_DEBUG_LEVEL=3
lib_deps =
  aquaponics-core
  bblanchon/ArduinoJson@7.4.2
  paulstoffregen/OneWire@2.3.8
  milesburton/DallasTemperature@4.0.4
