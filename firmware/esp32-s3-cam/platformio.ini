; ESP32-S3-WROOM-1 N16R8 (OPI PSRAM) + OV3660 — AliExpress ESP32-S3 CAM class boards.
; Pin map: Espressif CAMERA_MODEL_ESP32S3_EYE (see src/camera.cpp).
; Build merged image via post:extra_scripts/merge_factory_bin.py (repo: pnpm firmware:build:esp32:s3:cam)

[platformio]
boards_dir = boards

[env:esp32-s3-cam]
platform = espressif32@6.9.0
board = esp32-s3-cam-n16r8
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
extra_scripts = post:extra_scripts/merge_factory_bin.py
lib_extra_dirs = ../shared
build_flags =
  -DUD_CFG_REGION_SIZE=2048
  -DUD_WIFI_DEBUG=1
  -DCAMERA_MODEL_ESP32S3_EYE
  -DCORE_DEBUG_LEVEL=3
lib_deps =
  aquaponics-core
  bblanchon/ArduinoJson@7.4.2
  paulstoffregen/OneWire@2.3.8
  milesburton/DallasTemperature@4.0.4
